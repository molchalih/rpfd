[workspace]
resolver = "3"
members = ["crates/rpf-core", "crates/rpf", "tools/metadata-dump"]
# DR-007: the oracle generator links the reference implementation. It must not
# appear in a default build, in continuous integration, or in anything shipped.
# It is built deliberately, run once per corpus change, and what gets committed
# is its output. tools/oracle/README.md says how to run it.
#
# `tools/metadata-dump` is a member rather than an exclusion, and the contrast
# is the point: it links nothing but `rpf-core`, so the lint set, the formatter
# and `clippy --all-targets` reach it and the layout it states is checked where
# it is stated. Only the reference implementation has to be kept out.
#
# `fuzz` is excluded for a different reason: `cargo-fuzz` needs a nightly
# compiler, and `rust-toolchain.toml` pins this workspace to stable so that
# `-D warnings` means one thing for everyone (§15). Excluding it keeps that pin
# untouched. fuzz/Cargo.toml says what the targets assert.
exclude = ["tools/oracle", "fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
thiserror = "2.0"

# One place decides the lint levels; every member opts in with
# `lints.workspace = true`. docs/conventions.md §15 states what each row buys.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
# `cargo-fuzz` sets `--cfg fuzzing` over the whole build; nothing else does, and
# it is deliberately not a feature so that no dependent can switch it on
# (DR-048). Declaring it here is what keeps it a *known* cfg that is simply off
# — without this row the compiler reports the one `#[cfg(fuzzing)]` item in
# `rpf-core` as a typo, and `-D warnings` fails on it in every ordinary build.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# §6 — an archive is third-party data, and some of it is malformed on purpose.
# Every lint below turns a class of reachable panic into a compile error.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
