# Its own workspace, and excluded from the root one, because `cargo-fuzz` needs
# a nightly compiler and `rust-toolchain.toml` pins the workspace to stable.
# Nothing here is built by a default build, by `cargo test --all`, or by
# continuous integration. docs/conventions.md §14, the fuzzing row.
#
# This crate is built with `--cfg fuzzing`, which `cargo fuzz` sets for the
# whole build and nothing else does. The `encrypted` target does not compile
# without it and is not meant to: the constructor it reaches key material
# through is `#[cfg(fuzzing)]` in `rpf-core` precisely so that it exists under
# the fuzzer and in no other build (DR-048). To check this crate by hand, pass
# it — `RUSTFLAGS="--cfg fuzzing" cargo check --bins`.
[workspace]

[package]
name = "rpf-fuzz"
version = "0.0.0"
publish = false
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.98"

[package.metadata]
cargo-fuzz = true

[dependencies]
# docs/conventions.md §14, the fuzzing row: `cargo-fuzz` with `arbitrary` 1.4.
arbitrary = { version = "1.4", features = ["derive"] }
libfuzzer-sys = "0.4"
rpf-core = { path = "../crates/rpf-core" }
# docs/conventions.md §14, the XML row, and the same version the crate parses
# with. The metadata targets are the only ones whose subject *writes* bytes for
# something else to read, and `rpf_fuzz::well_formed` is the one question that
# can be asked of what `pso::to_xml` answers — it has no reader on this side.
quick-xml = "0.42"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

