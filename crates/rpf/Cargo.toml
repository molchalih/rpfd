[package]
name = "rpf"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rpf-core = { path = "../rpf-core" }
serde_json = "1"
base64 = "0.23"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
tempfile = "3"
thiserror = "2.0"

[dev-dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
tempfile = "3"

[lints]
workspace = true
