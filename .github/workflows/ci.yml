name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # A rule that is only written down is a rule that is only sometimes followed.
  # `.githooks/commit-msg` refuses a malformed message before it is made, but a
  # hook lives in one clone and is opt-in; this is the backstop that holds for
  # everyone. The rule is written down once; both readers of it are mechanical.
  commits:
    name: commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The hook is asked of every commit this push or pull request adds, so
          # the range has to be reachable.
          fetch-depth: 0
      - name: check every commit this change adds
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            range="HEAD~1..HEAD"
          else
            range="${{ github.event.before }}..HEAD"
          fi
          echo "checking $range"
          fail=0
          for sha in $(git rev-list "$range"); do
            git log -1 --format=%B "$sha" > /tmp/message
            if ! .githooks/commit-msg /tmp/message; then
              echo "  ^ $sha"
              fail=1
            fi
          done
          exit $fail

  # macOS, Linux and Windows are one target (docs/approach.md), and until this
  # matrix existed only one of them had ever been built. DR-012: a behaviour
  # that differs by platform and has no test is a defect waiting for its first
  # user, and the matrix is the mechanism rather than the intention. R10.1.
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform's result is wanted on every run. Cancelling the other two
      # the moment one fails is how a divergence gets read as a single failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      # The toolchain is pinned in rust-toolchain.toml so that `-D warnings`
      # means the same here as it does locally, and the same on all three.
      # docs/conventions.md §15.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # rustfmt.toml pins `newline_style = "Unix"`, so this also fails on a
      # clone whose line endings were rewritten — which is what .gitattributes
      # exists to prevent and this is what notices when it has not. R10.8.
      - run: cargo fmt --all -- --check

      # Per platform rather than once: the findings differ. `serve.rs`'s
      # `FileId` has three arms and no platform compiles more than two — the
      # `#[cfg(not(unix))]` fallback plus, on Windows, its own identity arm —
      # and with the Unix arm compiled out it produced three findings Linux
      # never sees. DR-037.
      - run: cargo clippy --all-targets --all-features -- -D warnings

      # No corpus is present here, and none ever will be: DR-006 keeps game
      # data out of tracked content. The suite must pass anyway, skipping what
      # it cannot reach and saying what it skipped. docs/backlog.md R8.4.
      #
      # And that claim is checked rather than asserted. `cargo test` prints `ok`
      # for a passing test and swallows its output, so a corpus test that
      # returned early would be indistinguishable in this log from one that ran
      # — the green suite that tested nothing, docs/conventions.md §12. The
      # count is written down so that adding a corpus test without a gate, or
      # gating one that should have run, fails here rather than going unnoticed.
      #
      # **One number for all three platforms, and that is not an oversight.**
      # The tests that vary by platform are gated by `#[cfg]` — `unix`, and
      # `any(unix, windows)` for the two that carry DR-009's file identity — so
      # where they do not apply they are not compiled at all rather than
      # reported as ignored: they change the total the suite runs and not the
      # count of corpus skips. Every corpus-gated test is unconditional. If that
      # ever stops being true this step is what says so.
      #
      # `shell: bash` because the default on the Windows runner is PowerShell,
      # where none of this is even syntax. `pipefail` because bash's own default
      # is `-e` without it, and a `tee` that succeeds would otherwise hide a
      # suite that did not.
      - name: the suite, and the tests it could not reach
        shell: bash
        run: |
          set -o pipefail
          cargo test --all 2>&1 | tee suite.log
          skipped=$(grep -c 'ignored, no RPF_CORPUS' suite.log || true)
          grep 'ignored, no RPF_CORPUS' suite.log || true
          test "$skipped" -eq 13 \
            || { echo "expected 13 corpus tests to report themselves skipped, got $skipped"; exit 1; }

  # `missing_docs` is on, so every public item has a doc comment, and a doc
  # comment is where a reader looks for a contract. A broken link in one is
  # prose that says something untrue about the code beside it, and `cargo doc`
  # says so and is not read: it emitted eight warnings for months, one of them
  # naming an `Error::Corrupt` that has never existed.
  #
  # Resolved once rather than per platform: nothing about a doc link varies by
  # runner, which is the same reason `deny` is asked once.
  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - run: cargo doc --no-deps --workspace

  # Licences and advisories are a property of Cargo.lock rather than of a
  # runner, so this is asked once. docs/conventions.md §15.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
