name: release

# A release publishes a binary per platform and the editor extension, so that
# installing `rpf` is downloading one file.
#
# Started by hand, never by a push. A tag is cheap and is often pushed to mark
# a point rather than to publish one, so the trigger is the decision to
# release rather than the tag itself. The tag must already exist and is what
# every artefact is named and versioned from.
#
# The gates live in ci.yml and run on every push to main and every pull request.
# This workflow builds what has already been checked rather than checking it
# again on four runners, three of which cannot execute what they produce.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "the existing tag to release, e.g. v0.1.0"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # One home for the tag. `GITHUB_*` is reserved, so it carries its own name.
  TAG: ${{ inputs.tag }}

permissions:
  contents: write

jobs:
  # One release to attach every asset to, created before the matrix so that four
  # jobs finishing at once cannot each try to create it.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - name: the release this tag names, created if it is not there yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" \
            || gh release create "$TAG" --title "$TAG" --generate-notes

  binaries:
    needs: release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-compiled from the arm64 runner: one macOS image, both
          # architectures, and the Apple SDK is what makes that ordinary.
          # `macos-latest` rather than a pinned `macos-14`: `ci.yml` proved the
          # matrix green on `macos-latest`, and `macos-14` is a deprecated
          # image on its way out from under a pinned label.
          - target: x86_64-apple-darwin
            os: macos-latest
          # musl rather than gnu, so the binary carries its own libc and runs on
          # a distribution older than the one that built it. Every dependency is
          # pure Rust — docs/conventions.md §14 rules out C ones — so there is
          # nothing here that a static libc cannot link.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            # Without this the .exe needs the Visual C++ runtime installed,
            # which is the prerequisite this whole track exists to avoid.
            rustflags: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      # As in ci.yml: the toolchain is pinned in rust-toolchain.toml, and
      # `rustup target add` follows that override rather than the default
      # toolchain, so the standard library added here is the pinned one's.
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: a musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools

      # The version comes from the tag, as the extension's does. The manifests
      # carry 0.0.0 and keep carrying it: a version committed to the tree is a
      # second place to forget. `--locked` still holds because the workspace
      # members are path dependencies and their version does not resolve.
      - name: the tag's version
        shell: bash
        run: |
          set -euo pipefail
          v="${TAG#v}"
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag $TAG is not a version" >&2; exit 1 ;;
          esac
          for m in Cargo.toml crates/*/Cargo.toml tools/*/Cargo.toml; do
            [ -f "$m" ] || continue
            perl -0pi -e "s/^version = \"0\\.0\\.0\"/version = \"$v\"/m" "$m"
          done
          # The lock records each workspace member's version, so rewriting the
          # manifests without it makes `--locked` refuse the build.
          for name in rpf rpf-core metadata-dump; do
            perl -0pi -e "s/(name = \"$name\"\nversion = )\"0\\.0\\.0\"/\${1}\"$v\"/" Cargo.lock
          done
          cargo metadata --format-version 1 --no-deps >/dev/null

      # --locked, because a release is the one build where resolving a
      # dependency differently from Cargo.lock must be a failure rather than a
      # surprise.
      - run: cargo build --release --locked --target ${{ matrix.target }} -p rpf
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # `bash` on all three runners, so the packaging is one script rather than
      # one per platform. Both licence files travel with the binary: MIT and
      # Apache-2.0 are offered at the recipient's option, so shipping one of
      # them would not be the offer.
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name="rpf-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/rpf.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/rpf" "dist/$name/"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=dist/$name.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" --clobber

  # R8.3's other half. The binaries above are what `rpf` is; the extension is
  # how it is used from an editor, and a release that attached four binaries and
  # no client would ship half the tool.
  #
  # A matrix, and the binary travels inside the package. This reverses the
  # earlier "nothing in a .vsix varies by platform": true of the JavaScript,
  # false of the product. An extension that finds no binary does nothing at all,
  # and v0.1.0 shipped exactly that — `locate.ts` looks in
  # `bin/<platform>-<arch>/` first and the package carried no `bin` at all, so a
  # first install was inert until the user separately fetched `rpf` and put it
  # on PATH. The packer already walks `bin/`; only this job never filled it.
  #
  # Each row declares its platform in the manifest, via `--target`, so the four
  # packages are more than four filenames. The last row carries no binary and
  # names no platform on purpose: a package with no target is the fallback for
  # every platform that has none of its own, so a platform this project does not
  # build for — linux-arm64 — still gets an extension that finds `rpf` on PATH,
  # which is the behaviour it has today.
  extension:
    needs: [release, binaries]
    name: vsix ${{ matrix.platform || 'any' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            target: aarch64-apple-darwin
          - platform: darwin-x64
            target: x86_64-apple-darwin
          - platform: linux-x64
            target: x86_64-unknown-linux-musl
          - platform: win32-x64
            target: x86_64-pc-windows-msvc
            exe: .exe
          - platform: ''
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          # `engines.node` says 20 at least; 22 is the LTS that satisfies it and
          # has `zlib.crc32`, which the packer uses to write the zip.
          node-version: 22
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json

      # --ci rather than --install, for --locked's reason one job up: a release
      # is the one build where resolving a dependency differently from the lock
      # file must be a failure rather than a surprise.
      - run: npm ci
        working-directory: clients/vscode

      # `package.json` carries `0.0.0` and keeps carrying it: the version an
      # artefact bears is a property of the tag that asked for it, not of the
      # working tree, and a version committed to the manifest is a second place
      # to forget to change. `npm version` writes the tag's version in for this
      # build alone and refuses anything that is not semver, so `v1.2.3` becomes
      # `1.2.3` and a tag that is not a version fails here rather than producing
      # a package nobody can install.
      #
      # The publisher is named here and nowhere else. `package.json` does not
      # carry one, deliberately: it is an identity rather than a fact about the
      # extension, and the packer takes it as an argument so that packaging and
      # publishing stay two acts. The repository variable lets a fork build its
      # own package without editing this file.
      # Taken from the release rather than passed between jobs: the assets are
      # already there, `binaries` is already a dependency, and an artefact
      # upload would be a second copy of the same bytes under a second name.
      - name: the binary this package carries
        if: matrix.platform != ''
        working-directory: clients/vscode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="rpf-${TAG}-${{ matrix.target }}"
          into="bin/${{ matrix.platform }}"
          mkdir -p "$into"
          if [ -n "${{ matrix.exe }}" ]; then
            gh release download "$TAG" --pattern "$name.zip" --dir .
            unzip -q "$name.zip"
          else
            gh release download "$TAG" --pattern "$name.tar.gz" --dir .
            tar -xzf "$name.tar.gz"
          fi
          mv "$name/rpf${{ matrix.exe }}" "$into/"
          chmod +x "$into/rpf${{ matrix.exe }}"
          rm -rf "$name" "$name.zip" "$name.tar.gz"

      - name: package
        working-directory: clients/vscode
        env:
          PUBLISHER: ${{ vars.VSCE_PUBLISHER || 'molchalih' }}
        run: |
          set -euo pipefail
          npm version --no-git-tag-version --allow-same-version "${TAG#v}"
          suffix="${{ matrix.platform && format('-{0}', matrix.platform) || '' }}"
          out="$PWD/rpf-${TAG}${suffix}.vsix"
          args=(--publisher "$PUBLISHER" --out "$out")
          if [ -n "${{ matrix.platform }}" ]; then
            args+=(--target "${{ matrix.platform }}")
          fi
          npm run package -- "${args[@]}"
          echo "ASSET=$out" >> "$GITHUB_ENV"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" --clobber

  # R8.6, and the half of R8.7 that is not a credential. One `.mcpb` — a zip of
  # the binaries beside a `manifest.json` — is both Claude Desktop's
  # drag-and-drop installer and the artefact the MCP registry's
  # `registryType: "mcpb"` points at, so it is built once and used twice.
  #
  # macOS, for `lipo`. The bundle format names a platform and not an
  # architecture, so `darwin` gets exactly one binary and it has to be the
  # universal one made from the two the matrix above already published: an
  # Intel Mac cannot run an arm64 binary and Rosetta does not translate that
  # way round.
  #
  # `server.json` is attached rather than published. Publishing it needs a
  # GitHub device-code login, which is a credential only the maintainer can
  # supply; clients/mcp/README.md names the two commands that finish the job.
  bundle:
    needs: [release, binaries]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      # From the release assets, as the extension job does: `binaries` is
      # already a dependency and the bytes are already there.
      - name: the binaries this bundle carries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p stage/server/darwin stage/server/linux stage/server/win32
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl; do
            name="rpf-${TAG}-$target"
            gh release download "$TAG" --pattern "$name.tar.gz" --dir .
            tar -xzf "$name.tar.gz"
          done
          win="rpf-${TAG}-x86_64-pc-windows-msvc"
          gh release download "$TAG" --pattern "$win.zip" --dir .
          unzip -q "$win.zip"
          lipo -create -output stage/server/darwin/rpf \
            "rpf-${TAG}-aarch64-apple-darwin/rpf" "rpf-${TAG}-x86_64-apple-darwin/rpf"
          mv "rpf-${TAG}-x86_64-unknown-linux-musl/rpf" stage/server/linux/rpf
          mv "$win/rpf.exe" stage/server/win32/rpf.exe

      - name: bundle
        shell: bash
        run: tools/mcpb/bundle.sh "${TAG#v}" stage "rpf-${TAG}.mcpb"

      # The registry rejects a package whose URL is not a GitHub or GitLab
      # release and whose URL does not contain "mcp" — the extension answers
      # the second — and clients check `fileSha256` before they run what they
      # downloaded, so it is computed here from the file that was just built
      # rather than written by hand from a file that may not be the same one.
      - name: the registry entry, filled in but not published
        shell: bash
        run: |
          set -euo pipefail
          asset="rpf-${TAG}.mcpb"
          jq --arg v "${TAG#v}" \
             --arg url "https://github.com/${{ github.repository }}/releases/download/${TAG}/$asset" \
             --arg sha "$(shasum -a 256 "$asset" | cut -d' ' -f1)" '
            .version = $v
            | .packages[0].version = $v
            | .packages[0].identifier = $url
            | .packages[0].fileSha256 = $sha
          ' tools/mcpb/server.json > server.json

      - name: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "rpf-${TAG}.mcpb" server.json --clobber
