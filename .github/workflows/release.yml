name: release

# A release publishes a binary per platform and the editor extension, so that
# installing `rpf` is downloading one file.
#
# Started by hand, never by a push. A tag is cheap and is often pushed to mark
# a point rather than to publish one, so the trigger is the decision to
# release rather than the tag itself. The tag must already exist and is what
# every artefact is named and versioned from.
#
# The gates live in ci.yml and run on every push to main and every pull request.
# This workflow builds what has already been checked rather than checking it
# again on four runners, three of which cannot execute what they produce.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "the existing tag to release, e.g. v0.1.0"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # One home for the tag. `GITHUB_*` is reserved, so it carries its own name.
  TAG: ${{ inputs.tag }}

permissions:
  contents: write

jobs:
  # One release to attach every asset to, created before the matrix so that four
  # jobs finishing at once cannot each try to create it.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - name: the release this tag names, created if it is not there yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" \
            || gh release create "$TAG" --title "$TAG" --generate-notes

  binaries:
    needs: release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-compiled from the arm64 runner: one macOS image, both
          # architectures, and the Apple SDK is what makes that ordinary.
          # `macos-latest` rather than a pinned `macos-14`: `ci.yml` proved the
          # matrix green on `macos-latest`, and `macos-14` is a deprecated
          # image on its way out from under a pinned label.
          - target: x86_64-apple-darwin
            os: macos-latest
          # musl rather than gnu, so the binary carries its own libc and runs on
          # a distribution older than the one that built it. Every dependency is
          # pure Rust — docs/conventions.md §14 rules out C ones — so there is
          # nothing here that a static libc cannot link.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            # Without this the .exe needs the Visual C++ runtime installed,
            # which is the prerequisite this whole track exists to avoid.
            rustflags: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      # As in ci.yml: the toolchain is pinned in rust-toolchain.toml, and
      # `rustup target add` follows that override rather than the default
      # toolchain, so the standard library added here is the pinned one's.
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: a musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools

      # The version comes from the tag, as the extension's does. The manifests
      # carry 0.0.0 and keep carrying it: a version committed to the tree is a
      # second place to forget. `--locked` still holds because the workspace
      # members are path dependencies and their version does not resolve.
      - name: the tag's version
        shell: bash
        run: |
          set -euo pipefail
          v="${TAG#v}"
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag $TAG is not a version" >&2; exit 1 ;;
          esac
          for m in Cargo.toml crates/*/Cargo.toml tools/*/Cargo.toml; do
            [ -f "$m" ] || continue
            perl -0pi -e "s/^version = \"0\\.0\\.0\"/version = \"$v\"/m" "$m"
          done
          cargo metadata --format-version 1 --no-deps >/dev/null

      # --locked, because a release is the one build where resolving a
      # dependency differently from Cargo.lock must be a failure rather than a
      # surprise.
      - run: cargo build --release --locked --target ${{ matrix.target }} -p rpf
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # `bash` on all three runners, so the packaging is one script rather than
      # one per platform. Both licence files travel with the binary: MIT and
      # Apache-2.0 are offered at the recipient's option, so shipping one of
      # them would not be the offer.
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name="rpf-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/rpf.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/rpf" "dist/$name/"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=dist/$name.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" --clobber

  # R8.3's other half. The binaries above are what `rpf` is; the extension is
  # how it is used from an editor, and a release that attached four binaries and
  # no client would ship half the tool. One runner and no matrix: a `.vsix` is a
  # zip of compiled JavaScript, and nothing in it varies by platform — the
  # per-platform part is the binary, which is attached separately and found on
  # PATH.
  extension:
    needs: release
    name: vsix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          # `engines.node` says 20 at least; 22 is the LTS that satisfies it and
          # has `zlib.crc32`, which the packer uses to write the zip.
          node-version: 22
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json

      # --ci rather than --install, for --locked's reason one job up: a release
      # is the one build where resolving a dependency differently from the lock
      # file must be a failure rather than a surprise.
      - run: npm ci
        working-directory: clients/vscode

      # `package.json` carries `0.0.0` and keeps carrying it: the version an
      # artefact bears is a property of the tag that asked for it, not of the
      # working tree, and a version committed to the manifest is a second place
      # to forget to change. `npm version` writes the tag's version in for this
      # build alone and refuses anything that is not semver, so `v1.2.3` becomes
      # `1.2.3` and a tag that is not a version fails here rather than producing
      # a package nobody can install.
      #
      # The publisher is named here and nowhere else. `package.json` does not
      # carry one, deliberately: it is an identity rather than a fact about the
      # extension, and the packer takes it as an argument so that packaging and
      # publishing stay two acts. The repository variable lets a fork build its
      # own package without editing this file.
      - name: package
        working-directory: clients/vscode
        env:
          PUBLISHER: ${{ vars.VSCE_PUBLISHER || 'molchalih' }}
        run: |
          set -euo pipefail
          npm version --no-git-tag-version --allow-same-version "${TAG#v}"
          out="$PWD/rpf-${TAG}.vsix"
          npm run package -- --publisher "$PUBLISHER" --out "$out"
          echo "ASSET=$out" >> "$GITHUB_ENV"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" --clobber
